services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_dev_only
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: gym
      RABBITMQ_DEFAULT_PASS: gym_dev_only
  users:
    build: {context: ., dockerfile: services/users/Dockerfile}
    ports: ["8001:8000"]
    environment:
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_users
    depends_on:
      rabbitmq: {condition: service_healthy}
      db: {condition: service_healthy}
  trainings:
    build: {context: ., dockerfile: services/trainings/Dockerfile}
    ports: ["8002:8000"]
    environment:
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_trainings
      USER_SERVICE_URL: http://users:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq: {condition: service_healthy}
      db: {condition: service_healthy}
      users: {condition: service_started}
      redis: {condition: service_started}
  reviews:
    build: {context: ., dockerfile: services/reviews/Dockerfile}
    ports: ["8003:8000"]
    environment:
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_reviews
      TRAINING_SERVICE_URL: http://trainings:8000
    depends_on:
      rabbitmq: {condition: service_healthy}
      db: {condition: service_healthy}
      trainings: {condition: service_started}
  subscriptions:
    build: {context: ., dockerfile: services/subscriptions/Dockerfile}
    ports: ["8004:8000"]
    environment:
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_subscriptions
      PAYMENT_SERVICE_URL: http://payments:8000
    depends_on:
      rabbitmq: {condition: service_healthy}
      db: {condition: service_healthy}
      payments: {condition: service_started}
  payments:
    build: {context: ., dockerfile: services/payments/Dockerfile}
    ports: ["8005:8000"]
    environment:
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_payments
    depends_on:
      rabbitmq: {condition: service_healthy}
      db: {condition: service_healthy}
  tours:
    build: {context: ., dockerfile: services/tours/Dockerfile}
    ports: ["8006:8000"]
    environment:
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_tours
    depends_on:
      rabbitmq: {condition: service_healthy}
      db: {condition: service_healthy}
  # Per-service RabbitMQ consumers with durable event queues; service APIs stay separate.
  subscriptions_events:
    build: {context: ., dockerfile: services/subscriptions/Dockerfile}
    command: ["python", "-m", "rabbitmq.workers", "subscriptions"]
    environment:
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_subscriptions
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  payments_events:
    build: {context: ., dockerfile: services/payments/Dockerfile}
    command: ["python", "-m", "rabbitmq.workers", "payments"]
    environment:
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_payments
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  reviews_events:
    build: {context: ., dockerfile: services/reviews/Dockerfile}
    command: ["python", "-m", "rabbitmq.workers", "reviews"]
    environment:
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_reviews
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  tours_events:
    build: {context: ., dockerfile: services/tours/Dockerfile}
    command: ["python", "-m", "rabbitmq.workers", "tours"]
    environment:
      DATABASE_URL: postgresql+psycopg://gym:gym_dev_only@db:5432/gym_tours
      AMQP_URL: amqp://gym:gym_dev_only@rabbitmq:5672/
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
volumes:
  pgdata:
  rabbitdata:
